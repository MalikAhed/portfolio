<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e8" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Malik Abuallata is a full-stack developer creating expressive interfaces and dependable digital systems."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Malik Abuallata — Full-stack developer"
    />
    <meta
      property="og:description"
      content="Expressive interfaces and dependable digital systems, built across the stack."
    />
    <meta property="og:url" content="https://malikahed.github.io/portfolio/" />
    <meta
      property="og:image"
      content="https://malikahed.github.io/portfolio/assets/malik-monogram-v2.png"
    />
    <meta property="og:image:alt" content="Malik Abuallata monogram" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://malikahed.github.io/portfolio/" />
    <link rel="icon" type="image/webp" href="/assets/malik-monogram-v2.webp" />
    <style>
      html,
      body {
        margin: 0;
        background: #f5f0e8;
      }
    </style>
    <noscript>
      <style>
        .splash {
          display: none !important;
        }
      </style>
    </noscript>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <link
      rel="preload"
      as="image"
      href="/assets/malik-monogram-v2.webp"
      type="image/webp"
    />
    <link
      rel="preload"
      as="image"
      href="/assets/malik-cutout-v3.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <title>Malik Abuallata — Full-stack developer</title>
  </head>
  <body id="top">
    <script>
      document.documentElement.classList.add("has-js");
      document.body.classList.add("is-intro-pending");

      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      if (window.location.hash) {
        history.replaceState(
          history.state,
          "",
          `${window.location.pathname}${window.location.search}`,
        );
      }
      window.scrollTo(0, 0);

      window.__portfolioSplashFailsafe = window.setTimeout(() => {
        document.body.classList.remove(
          "is-intro-pending",
          "is-intro-exiting",
          "is-hero-entering",
          "is-splash-animating",
        );
        document.body.classList.add("is-intro-complete");
        const app = document.querySelector("#app");
        if (app) app.inert = false;
      }, 5000);
    </script>
    <div
      class="splash"
      role="status"
      aria-label="Loading Malik Abuallata's portfolio"
    >
      <div class="splash__center">
        <span class="splash__mark-shell" aria-hidden="true">
          <img
            class="splash__mark"
            src="/assets/malik-monogram-v2.webp"
            width="1024"
            height="1024"
            alt=""
            decoding="async"
            draggable="false"
          />
        </span>
        <p class="splash__name">Malik Abuallata</p>
        <div class="splash__loader" aria-hidden="true">
          <div class="splash__status">
            <span>Loading portfolio</span>
            <span class="splash__percentage">0%</span>
          </div>
          <span class="splash__progress"
            ><span class="splash__progress-fill"></span
          ></span>
        </div>
      </div>
    </div>
    <script>
      document.body.classList.add("is-splash-animating");
    </script>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <main id="app">
      <div
        id="main-content"
        class="world-stage portfolio-world"
        data-world-stage
        tabindex="-1"
      >
        <div class="base-world" aria-hidden="true"></div>
        <div
          id="scene"
          class="scene depth-world__subject"
          aria-hidden="true"
        ></div>
        <section
          id="project-cards"
          class="project-cards-layer"
          aria-label="Interactive project previews"
        ></section>
        <details
          class="project-frame-editor interface-layer"
          data-project-frame-editor
          hidden
        >
          <summary>
            <span>Project Frames</span>
            <span class="project-frame-editor__mark" aria-hidden="true">+</span>
          </summary>
          <div class="project-frame-editor__body">
            <label
              class="project-frame-editor__select"
              for="project-frame-editor-select"
            >
              <span>Selected project</span>
              <select
                id="project-frame-editor-select"
                data-project-frame-select
              >
                <option value="0">Project 1 · left</option>
                <option value="1">Project 2 · right</option>
                <option value="2">Project 3 · left</option>
                <option value="3">Project 4 · right</option>
              </select>
            </label>
            <fieldset class="project-frame-editor__group">
              <legend>Position</legend>
              <div class="project-frame-editor__grid">
                <label class="project-frame-editor__field">
                  <span>X</span>
                  <input
                    type="number"
                    step="0.01"
                    data-project-frame-position="x"
                  />
                </label>
                <label class="project-frame-editor__field">
                  <span>Y</span>
                  <input
                    type="number"
                    step="0.01"
                    data-project-frame-position="y"
                  />
                </label>
                <label class="project-frame-editor__field">
                  <span>Z</span>
                  <input
                    type="number"
                    step="0.01"
                    data-project-frame-position="z"
                  />
                </label>
              </div>
            </fieldset>
            <fieldset class="project-frame-editor__group">
              <legend>Rotation (degrees)</legend>
              <div class="project-frame-editor__grid">
                <label class="project-frame-editor__field">
                  <span>X</span>
                  <input
                    type="number"
                    step="1"
                    data-project-frame-rotation="x"
                  />
                </label>
                <label class="project-frame-editor__field">
                  <span>Y</span>
                  <input
                    type="number"
                    step="1"
                    data-project-frame-rotation="y"
                  />
                </label>
                <label class="project-frame-editor__field">
                  <span>Z</span>
                  <input
                    type="number"
                    step="1"
                    data-project-frame-rotation="z"
                  />
                </label>
              </div>
            </fieldset>
            <fieldset class="project-frame-editor__group">
              <legend>Frame dimensions (world units)</legend>
              <div
                class="project-frame-editor__grid project-frame-editor__grid--dimensions"
              >
                <label class="project-frame-editor__field">
                  <span class="project-frame-editor__slider-heading">
                    <span>Width</span>
                    <output data-project-frame-dimension-value="width"></output>
                  </span>
                  <input
                    type="range"
                    min="2"
                    max="10"
                    step="0.05"
                    data-project-frame-dimension="width"
                  />
                </label>
                <label class="project-frame-editor__field">
                  <span class="project-frame-editor__slider-heading">
                    <span>Height</span>
                    <output
                      data-project-frame-dimension-value="height"
                    ></output>
                  </span>
                  <input
                    type="range"
                    min="1.5"
                    max="7"
                    step="0.05"
                    data-project-frame-dimension="height"
                  />
                </label>
              </div>
            </fieldset>
            <label class="project-frame-editor__field">
              <span class="project-frame-editor__slider-heading">
                <span>Scale</span>
                <output data-project-frame-size-value></output>
              </span>
              <input
                type="range"
                min="0.1"
                max="2"
                step="0.01"
                data-project-frame-size
              />
            </label>
            <div class="project-frame-editor__actions">
              <button type="button" data-project-frame-copy-settings>
                Copy all settings
              </button>
              <button type="button" data-project-frame-copy-size>
                Copy size
              </button>
              <button type="button" data-project-frame-reset>
                Reset project
              </button>
              <button type="button" data-project-frame-reset-all>
                Reset all
              </button>
            </div>
          </div>
        </details>
        <section class="hero" aria-labelledby="hero-title">
          <header class="site-header interface-layer">
            <a class="brand" href="#top" aria-label="Malik Abuallata, home">
              <img
                class="brand__mark"
                src="/assets/malik-monogram-v2.webp"
                width="1024"
                height="1024"
                alt=""
                aria-hidden="true"
                decoding="async"
                draggable="false"
              />
              <span class="brand__divider" aria-hidden="true"></span>
              <span class="brand__name">malik abuallata</span>
            </a>
            <button
              class="menu-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="primary-navigation"
            >
              <span class="menu-toggle__label">Menu</span>
              <span class="menu-toggle__icon" aria-hidden="true"></span>
            </button>
            <nav
              id="primary-navigation"
              class="navigation"
              aria-label="Primary navigation"
            >
              <a
                class="navigation__contact"
                href="mailto:hello@malikabuallatta.com"
                >contact</a
              >
            </nav>
            <a class="contact-link" href="mailto:hello@malikabuallatta.com">
              <span class="contact-link__material" aria-hidden="true"></span>
              <span class="contact-link__label">contact</span>
              <span class="contact-link__flight" aria-hidden="true">
                <svg
                  class="contact-link__plane"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="m22 2-7 20-4-9-9-4Z"></path>
                  <path d="M22 2 11 13"></path>
                </svg>
              </span>
            </a>
          </header>
          <div class="hero-origin-dom">
            <picture class="hero__portrait-fallback" aria-hidden="true">
              <source type="image/webp" srcset="/assets/malik-cutout-v3.webp" />
              <img
                src="/assets/malik-cutout-v3.webp"
                width="1024"
                height="1536"
                alt=""
                fetchpriority="high"
                decoding="async"
                draggable="false"
              />
            </picture>
            <div class="hero__identity">
              <h1 id="hero-title">Malik Abuallata</h1>
              <p class="hero__role">Full-stack developer</p>
            </div>
            <p class="hero__backdrop" aria-hidden="true">Portfolio</p>
          </div>
        </section>
        <div class="work-title" data-work-title>
          <h2>My Work</h2>
        </div>
        <div
          id="work"
          class="journey-track"
          data-journey-track
          aria-hidden="true"
        ></div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
